name: api-probe
on:
  workflow_dispatch:
    inputs:
      days:
        description: "History window in days"
        default: "730"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - name: Run probe
        env:
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
          AIR4THAI_CA_BUNDLE: certs/air4thai-ca.pem
        run: uv run python -m pm25_forecast.ingest.probe --out probe-report --days "${{ inputs.days }}"
      - name: Job summary
        if: always()
        run: cat probe-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: probe-report
          path: probe-report.*
